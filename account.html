      <div class="p-5 border-b border-blue-100 flex items-center justify-between">
        <span class="text-base font-black text-gray-900">Menu</span>
        <button id="btn-mobile-close" class="p-2 hover:bg-blue-50 rounded-lg transition text-[10px] font-bold uppercase tracking-wide text-gray-600">
          🔙 Back
        </button>
      </div>
      <div class="p-4 border-b border-blue-100">
        <div class="flex items-center gap-3">
          <div id="mobile-avatar" class="w-11 h-11 rounded-xl bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center text-white font-bold text-sm shrink-0 overflow-hidden"></div>
          <div class="min-w-0">
            <p id="mobile-name" class="text-sm font-bold text-gray-900 truncate">Loading...</p>
            <p id="mobile-email" class="text-xs text-gray-500 truncate">—</p>
          </div>
        </div>
      </div>
      <nav id="mobile-nav-menu" class="flex-1 overflow-y-auto scrollbar-none p-3 space-y-0.5"></nav>
      <div class="p-3 border-t border-blue-100">
        <button id="btn-signout-mobile" class="btn-press w-full flex items-center gap-3 px-3 py-2.5 text-sm text-gray-600 hover:text-red-600 hover:bg-red-50 rounded-xl transition relative overflow-hidden">
          <i data-lucide="log-out" class="w-4 h-4"></i> Logout
        </button>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <main class="pt-16 lg:pt-0 lg:pl-64 min-h-screen relative z-10">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 lg:py-8">
      <div id="dashboard-root" class="min-h-[400px]">
        <div class="flex items-center justify-center py-20">
          <div class="flex items-center gap-3 text-gray-500 text-sm">
            <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-blue-600"></i>
            Loading your dashboard...
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-[100] transform translate-y-20 opacity-0 bg-gray-900 border border-blue-500/30 text-white px-5 py-3 rounded-xl shadow-xl text-xs flex items-center gap-2 font-medium transition-all duration-300 pointer-events-none">
    <i data-lucide="info" class="w-4 h-4 text-blue-600"></i><span id="toast-msg">Action</span>
  </div>

  <script src="/back-button.js" defer></script>
  <!-- APP PROMOTION BANNER + LIVE PRODUCT PROMOTIONS -->
  <div id="trust-info-area"></div>
  <div id="app-promo-banner"></div>
  <div id="live-promo-alerts" class="fixed bottom-4 right-4 z-50 w-[340px] max-w-[90vw] space-y-3 pointer-events-none" aria-live="polite"></div>
</body>
</html>
